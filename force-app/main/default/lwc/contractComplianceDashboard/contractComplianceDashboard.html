<template>
    <lightning-card title={cardTitle} icon-name="standard:task2">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading compliance data" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </div>
        </template>

        <template if:true={contract.data}>
            <!-- Overall Score Header -->
            <div class="slds-p-horizontal_medium slds-p-top_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                    <div class="slds-col">
                        <lightning-icon icon-name={overallIcon} variant={overallIconVariant} size="small" class="slds-m-right_x-small"></lightning-icon>
                        <span class="slds-text-body_regular">{scoreLabel}</span>
                    </div>
                </div>
                <lightning-progress-bar value={progressValue} variant={progressVariant} size="medium"></lightning-progress-bar>
            </div>

            <!-- Compliance Items List -->
            <template if:true={hasItems}>
                <div class="slds-p-around_medium">
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={complianceItems} for:item="item">
                            <li key={item.id} class="slds-item compliance-item">
                                <div class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xx-small">
                                    <div class="slds-col slds-size_1-of-12">
                                        <lightning-icon
                                            icon-name={item.icon}
                                            variant={item.variant}
                                            size="x-small"
                                            alternative-text={item.statusText}>
                                        </lightning-icon>
                                    </div>
                                    <div class="slds-col slds-size_8-of-12">
                                        <span class="slds-text-body_regular">{item.label}</span>
                                    </div>
                                    <div class="slds-col slds-size_3-of-12 slds-text-align_right">
                                        <lightning-badge label={item.statusText} class={item.variant}></lightning-badge>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <template if:false={hasItems}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                    No compliance requirements for this contract.
                </div>
            </template>
        </template>
    </lightning-card>
</template>
