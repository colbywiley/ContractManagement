<template>
    <lightning-card title={pathLabel} icon-name="standard:flow">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading approval path" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </div>
        </template>

        <template if:true={hasData}>
            <div class="slds-p-around_medium">
                <lightning-progress-indicator
                    current-step={currentStep}
                    type="path"
                    variant="base">
                    <template for:each={steps} for:item="step">
                        <lightning-progress-step
                            key={step.value}
                            label={step.label}
                            value={step.value}>
                        </lightning-progress-step>
                    </template>
                </lightning-progress-indicator>
            </div>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="slds-grid slds-grid_align-spread">
                    <div class="slds-col">
                        <span class="slds-text-body_small slds-text-color_weak">
                            Current Status: <strong>{currentStatus}</strong>
                        </span>
                    </div>
                    <template if:true={approvalPath}>
                        <div class="slds-col slds-text-align_right">
                            <span class="slds-text-body_small slds-text-color_weak">
                                Path: <strong>{approvalPath}</strong>
                            </span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
