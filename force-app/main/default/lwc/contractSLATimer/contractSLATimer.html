<template>
    <lightning-card title="SLA Timers" icon-name="standard:timesheet_entry">
        <div slot="actions">
            <lightning-icon icon-name={overallStatusIcon} variant={overallStatusVariant} size="small"></lightning-icon>
            <lightning-badge label={overallSlaStatus} class="slds-m-left_x-small"></lightning-badge>
        </div>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading SLA data" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </div>
        </template>

        <template if:true={hasData}>
            <!-- SLA Timers List -->
            <template if:true={hasTimers}>
                <div class="slds-p-around_medium">
                    <template for:each={slaTimers} for:item="timer">
                        <div key={timer.id} class={timer.timerClass}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                <div class="slds-col slds-grow">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name={timer.icon} variant={timer.variant} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        <span class="slds-text-heading_small timer-label">{timer.label}</span>
                                    </div>
                                </div>
                                <div class="slds-col slds-shrink">
                                    <lightning-badge label={timer.statusLabel}></lightning-badge>
                                </div>
                            </div>

                            <div class="slds-grid slds-wrap slds-gutters_xx-small slds-m-bottom_xx-small">
                                <div class="slds-col slds-size_1-of-2">
                                    <span class="slds-text-body_small slds-text-color_weak">SLA: {timer.slaRule}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                                    <span class="slds-text-body_small slds-text-color_weak">Deadline: {timer.deadlineFormatted}</span>
                                </div>
                            </div>

                            <lightning-progress-bar value={timer.progressValue} size="small"></lightning-progress-bar>

                            <div class="slds-m-top_xx-small">
                                <span class="slds-text-body_small remaining-text">{timer.remainingText}</span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Not Submitted Message -->
            <template if:true={showNotSubmittedMessage}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                    <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    SLA timers will begin once the contract is submitted.
                </div>
            </template>

            <!-- Executed Message -->
            <template if:true={showExecutedMessage}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                    <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    This contract has been executed. SLA tracking is complete.
                </div>
            </template>

            <!-- No Active Timers -->
            <template if:true={showNoTimersMessage}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                    <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    No active SLA timers for the current contract status.
                </div>
            </template>
        </template>
    </lightning-card>
</template>
