<template>
    <lightning-card title={cardTitle} icon-name="standard:entitlement">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading subject rules" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </div>
        </template>

        <template if:true={hasData}>
            <div class="slds-p-around_medium">
                <!-- Approval Path Section -->
                <div class="slds-section slds-is-open slds-m-bottom_small">
                    <h3 class="section-header slds-text-heading_small slds-m-bottom_x-small">
                        <lightning-icon icon-name="utility:routing_offline" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Approval Path
                    </h3>
                    <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_x-small">
                        <div class="slds-col slds-size_1-of-2 slds-p-vertical_xx-small">
                            <span class="slds-text-body_small slds-text-color_weak">Path:</span>
                            <span class="slds-text-body_regular slds-m-left_xx-small"><strong>{approvalPath}</strong></span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-vertical_xx-small">
                            <span class="slds-text-body_small slds-text-color_weak">Contract Value:</span>
                            <span class="slds-text-body_regular slds-m-left_xx-small"><strong>{contractValue}</strong></span>
                        </div>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak path-description">{approvalPathDescription}</p>
                </div>

                <!-- Required Documents Section -->
                <div class="slds-section slds-is-open slds-m-bottom_small">
                    <h3 class="section-header slds-text-heading_small slds-m-bottom_x-small">
                        <lightning-icon icon-name="utility:file" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Required Documents
                    </h3>
                    <template if:true={hasRequiredDocuments}>
                        <ul class="slds-list_dotted">
                            <template for:each={requiredDocuments} for:item="doc">
                                <li key={doc.id} class="slds-item slds-text-body_regular">
                                    {doc.label}
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template if:false={hasRequiredDocuments}>
                        <p class="slds-text-body_small slds-text-color_weak">No special documents required.</p>
                    </template>
                </div>

                <!-- Legal Review Section -->
                <div class="slds-section slds-is-open slds-m-bottom_small">
                    <h3 class="section-header slds-text-heading_small slds-m-bottom_x-small">
                        <lightning-icon icon-name="utility:legal" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Legal Review
                    </h3>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-2 slds-p-vertical_xx-small">
                            <span class="slds-text-body_small slds-text-color_weak">Required:</span>
                            <span class="slds-m-left_xx-small">
                                <template if:true={legalReviewRequired}>
                                    <lightning-icon icon-name="utility:success" variant="success" size="xx-small"></lightning-icon>
                                    <span class="slds-m-left_xx-small">Yes</span>
                                </template>
                                <template if:false={legalReviewRequired}>
                                    <span>No</span>
                                </template>
                            </span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-vertical_xx-small">
                            <span class="slds-text-body_small slds-text-color_weak">Timing:</span>
                            <span class="slds-text-body_regular slds-m-left_xx-small"><strong>{legalReviewTiming}</strong></span>
                        </div>
                    </div>
                </div>

                <!-- Required Signatories Section -->
                <div class="slds-section slds-is-open slds-m-bottom_small">
                    <h3 class="section-header slds-text-heading_small slds-m-bottom_x-small">
                        <lightning-icon icon-name="utility:edit_form" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Required Signatories
                    </h3>
                    <template if:true={hasSignatoryRules}>
                        <ul class="slds-list_dotted">
                            <template for:each={signatoryRules} for:item="sig">
                                <li key={sig.id} class="slds-item slds-text-body_regular">
                                    {sig.role}
                                    <template if:true={sig.required}>
                                        <lightning-badge label="Required" class="slds-m-left_x-small"></lightning-badge>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template if:false={hasSignatoryRules}>
                        <p class="slds-text-body_small slds-text-color_weak">Signatory rules not yet determined.</p>
                    </template>
                </div>

                <!-- Additional Rules Section -->
                <div class="slds-section slds-is-open">
                    <h3 class="section-header slds-text-heading_small slds-m-bottom_x-small">
                        <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Additional Requirements
                    </h3>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-2 slds-p-vertical_xx-small">
                            <span class="slds-text-body_small slds-text-color_weak">Board Approval:</span>
                            <span class="slds-m-left_xx-small">
                                <template if:true={boardApprovalRequired}>
                                    <lightning-badge label="Required" class="badge-required"></lightning-badge>
                                </template>
                                <template if:false={boardApprovalRequired}>
                                    <span>Not Required</span>
                                </template>
                            </span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-vertical_xx-small">
                            <span class="slds-text-body_small slds-text-color_weak">Gift Acceptance Review:</span>
                            <span class="slds-m-left_xx-small">
                                <template if:true={giftAcceptanceReview}>
                                    <lightning-badge label="Required" class="badge-required"></lightning-badge>
                                </template>
                                <template if:false={giftAcceptanceReview}>
                                    <span>Not Required</span>
                                </template>
                            </span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-vertical_xx-small">
                            <span class="slds-text-body_small slds-text-color_weak">YGSF Template:</span>
                            <span class="slds-m-left_xx-small">
                                <template if:true={templateUsed}>
                                    <span>{templateName}</span>
                                </template>
                                <template if:false={templateUsed}>
                                    <span>Not Using YGSF Template</span>
                                </template>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
