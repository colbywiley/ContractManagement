<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
    </template>

    <template if:true={context}>
        <div class={panelClass}>
            <!-- Role Badge & Status -->
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <lightning-icon icon-name={context.statusIcon} size="small" class="slds-m-right_x-small"></lightning-icon>
                    <span class="slds-text-heading_small slds-text-color_default">
                        <strong>{statusLabel}</strong>
                    </span>
                </div>
                <lightning-badge label={context.userRole} class="role-badge"></lightning-badge>
            </div>

            <!-- Guidance Message -->
            <p class="slds-m-bottom_small guidance-text">{context.guidanceMessage}</p>

            <!-- Approval Path Indicator -->
            <template if:true={showApprovalPath}>
                <div class="slds-m-bottom_small">
                    <span class="slds-text-body_small slds-text-color_weak">
                        Approval Path: {context.approvalPath}
                    </span>
                </div>
            </template>

            <!-- Action Buttons -->
            <template if:true={hasActions}>
                <div class="slds-grid slds-grid_align-start slds-gutters_x-small">
                    <template for:each={context.actions} for:item="action">
                        <div key={action.actionName} class="slds-col">
                            <lightning-button
                                label={action.label}
                                variant={action.variant}
                                icon-name={action.iconName}
                                data-action={action.actionName}
                                onclick={handleAction}
                                disabled={isProcessing}
                            ></lightning-button>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </template>

    <!-- Comments Modal for Reject/Revision actions -->
    <template if:true={showCommentsModal}>
        <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title">{modalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Comments"
                        value={comments}
                        onchange={handleCommentsChange}
                        placeholder={commentsPlaceholder}
                        required={commentsRequired}
                    ></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button
                        label={modalConfirmLabel}
                        variant={modalConfirmVariant}
                        onclick={confirmModalAction}
                        disabled={isProcessing}
                        class="slds-m-left_x-small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
